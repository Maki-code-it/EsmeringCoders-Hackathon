name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-check:
    name: Install, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Installs strictly from the root package-lock.json
      - name: Install dependencies
        run: npm ci

      # Runs only where a "lint" script exists (--if-present)
      - name: Lint
        run: npm run lint

      # Runs only where a "test" script exists (--if-present)
      - name: Test
        run: npm run test

      # No secrets required: VITE_* values default to safe empty/local values
      - name: Build frontend
        run: npm run build
